<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1f3a">
  <title>Gem Grid</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Grey-box gem silhouettes: one distinct shape per color so the game is
       playable without color vision. Facets and highlights come with polish. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="gem-0" viewBox="0 0 100 100"><polygon points="50,4 92,27 92,73 50,96 8,73 8,27"/></symbol>
      <symbol id="gem-1" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44"/></symbol>
      <symbol id="gem-2" viewBox="0 0 100 100"><rect x="12" y="20" width="76" height="60" rx="6"/></symbol>
      <symbol id="gem-3" viewBox="0 0 100 100"><polygon points="50,6 94,88 6,88"/></symbol>
      <symbol id="gem-4" viewBox="0 0 100 100"><polygon points="50,4 94,50 50,96 6,50"/></symbol>
      <symbol id="gem-5" viewBox="0 0 100 100"><path d="M50 4 C50 4 90 44 90 64 A40 40 0 0 1 10 64 C10 44 50 4 50 4 Z"/></symbol>
    </defs>
  </svg>

  <div id="app" class="app">
    <section id="screen-start" class="screen start">
      <h1>Gem Grid</h1>
      <p class="tagline">Turn the whole grid one color with the cards in your hand.</p>
      <div id="tier-list" class="tier-list"></div>
      <p class="hint">Working title. Grey-box build: shapes and colors are placeholders.</p>
    </section>

    <section id="screen-game" class="screen game hidden">
      <header class="hdr">
        <button id="btn-home" class="hdr-btn" aria-label="Back to tiers">‹</button>
        <div class="hdr-info">
          <span id="hdr-tier" class="hdr-tier"></span>
          <span id="hdr-cards" class="hdr-cards"></span>
          <span id="hdr-par" class="hdr-par"></span>
        </div>
        <button id="btn-restart" class="hdr-btn" aria-label="Restart this puzzle">↺</button>
        <button id="btn-menu" class="hdr-btn" aria-label="Settings">⋯</button>
      </header>
      <div class="grid-wrap">
        <div id="grid" class="grid" role="grid"></div>
      </div>
      <div id="strip" class="strip"></div>
      <div id="hand" class="hand"></div>
    </section>

    <div id="overlay" class="overlay hidden" role="dialog"></div>
    <div id="toast" class="toast hidden"></div>
  </div>

  <script type="module" src="js/ui.js"></script>
</body>
</html>
